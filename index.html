<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suche</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1f2430;--muted:#667085;--line:#e5e7eb;--brand:#2563eb}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:760px;margin:0 auto;padding:18px}
h1{margin:8px 0 4px;font-size:28px}
p{margin:0 0 14px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(16,24,40,.04);margin-bottom:14px}
input{width:100%;font-size:18px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);outline:none}
input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(37,99,235,.12)}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.count{color:var(--muted);font-size:14px}
.result{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.name{font-size:18px;font-weight:700;margin-bottom:4px}
.room{font-size:17px}
.note{font-size:13px;color:var(--muted);margin-top:4px}
button{border:none;background:var(--brand);color:#fff;padding:12px 14px;border-radius:12px;font-size:15px;cursor:pointer}
.secondary{background:#e9eefc;color:#1d4ed8}
.top-actions{display:flex;gap:10px;flex-wrap:wrap}
.small{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Suche</h1>
  <p>Suche nach Name oder Zahl und teile das Ergebnis mit einem Klick.</p>

  <div class="card">
    <input id="q" placeholder="Name oder Zahl" autocomplete="off" autocapitalize="none">
    <div class="row" style="margin-top:10px">
      <div class="count" id="count"></div>
      <div class="top-actions">
        <button class="secondary" id="clear">Leeren</button>
      </div>
    </div>
  </div>

  <div id="results"></div>
  <div class="small">Tipp: Diese Datei muss auf GitHub Pages als index.html im Hauptordner liegen.</div>
</div>

<script>
const tenants = [{room:'01',name:'Kerbach',note:''},{room:'02',name:'Pätzold',note:''},{room:'03',name:'Tröndle',note:''},{room:'04',name:'Nandakumaran',note:''},{room:'05',name:'Holzhäuer',note:''},{room:'06',name:'Geranmayeh',note:''},{room:'07',name:'Perreira Baptista',note:''},{room:'08',name:'Onyebuchi',note:''},{room:'09',name:'Bronner',note:''},{room:'10',name:'Lang',note:''},{room:'11',name:'Tufan',note:''},{room:'12',name:'Gupta',note:''},{room:'13',name:'Aydin',note:''},{room:'14',name:'R. Schröder',note:''},{room:'15',name:'Seidel',note:''},{room:'16',name:'Klingler',note:''},{room:'17',name:'Nedvedicky',note:''},{room:'18',name:'Arunbabu',note:''},{room:'19',name:'Yelanchyk',note:''},{room:'20',name:'Walendzik',note:''},{room:'21',name:'Maximow',note:''},{room:'22',name:'Krawinkel',note:''},{room:'23',name:'Gyurkan',note:''},{room:'24',name:'Hatzenbühler',note:''},{room:'25',name:'Wirzberger',note:''},{room:'26',name:'Sun',note:''},{room:'27',name:'Xinxin',note:''},{room:'28',name:'Fabricius',note:''},{room:'29',name:'Napp',note:''},{room:'30',name:'A. Bauer',note:''},{room:'31',name:'Geymeier',note:''},{room:'32',name:'Chen',note:''},{room:'33',name:'Zinnanti',note:''},{room:'34',name:'Song',note:''},{room:'35',name:'Hoch',note:''},{room:'36',name:'Pratik Raut',note:''},{room:'37',name:'Yilmaz Duran',note:''},{room:'38',name:'Y. Luo',note:''},{room:'39',name:'Zhu',note:''},{room:'40',name:'Görgen',note:''},{room:'41',name:'Etheah',note:''},{room:'42',name:'Dai',note:''},{room:'43',name:'Oberem',note:''},{room:'44',name:'Sedlmeier',note:''},{room:'45',name:'C. Liu',note:''},{room:'46',name:'Mircea',note:''},{room:'47',name:'Maier',note:''},{room:'48',name:'Talab',note:''},{room:'49',name:'Werner',note:''},{room:'50',name:'Treptow',note:''},{room:'51',name:'Weisser',note:''},{room:'52',name:'Özcelik',note:''},{room:'53',name:'Yuer',note:''},{room:'54',name:'Beydas & Durmahay',note:''},{room:'55',name:'Viet',note:''},{room:'56',name:'Yixuan Liu',note:''},{room:'57',name:'Baykal',note:''},{room:'58',name:'Khandaker',note:''},{room:'59',name:'Klier',note:''},{room:'60',name:'Kott',note:''},{room:'61',name:'Wang',note:''},{room:'62',name:'Uwumukiza',note:''},{room:'63',name:'Walcher',note:''},{room:'64',name:'Y. Sun',note:''},{room:'65',name:'Assanov',note:''},{room:'66',name:'Rezapour',note:''},{room:'67',name:'Geiger',note:''},{room:'68',name:'Ziebolz',note:''},{room:'69',name:'Arsamaskin',note:''},{room:'70',name:'Ayasse',note:''},{room:'71',name:'Chrysostomidou',note:''},{room:'72',name:'Dietrich',note:''},{room:'73',name:'T. Li',note:''},{room:'74',name:'Matta',note:''},{room:'75',name:'Dreioecker',note:''},{room:'76',name:'Bozkurt',note:''},{room:'77',name:'Martin',note:''},{room:'78',name:'BW Partner',note:''},{room:'79',name:'BW Partner',note:''},{room:'80',name:'W. Liu',note:''},{room:'81',name:'Elzanaty',note:''},{room:'82',name:'Wittrock',note:''},{room:'83',name:'Tonke',note:''},{room:'84',name:'Sintara',note:''},{room:'85',name:'Han',note:''},{room:'86',name:'Twisselmann',note:''},{room:'87',name:'Yigit',note:''},{room:'88',name:'E. Schröder',note:''},{room:'89',name:'Liu, Yiran',note:''},{room:'90',name:'BW Partner',note:''},{room:'91',name:'Fix',note:''},{room:'92',name:'Weiss',note:''},{room:'93',name:'Knorr',note:''},{room:'94',name:'Metzger',note:''},{room:'95',name:'Wilmer',note:''},{room:'96',name:'Hankh',note:''},{room:'97',name:'Haifan Zhong',note:''},{room:'98',name:'Raster',note:''},{room:'99',name:'Prochnow',note:''},{room:'100',name:'Ünal',note:''},{room:'101',name:'Fischer',note:''},{room:'102',name:'Knoll',note:''},{room:'103',name:'Wang',note:''},{room:'104',name:'Geike',note:''},{room:'105',name:'Stephan',note:''},{room:'106',name:'Gerdts',note:''},{room:'107',name:'BW Partner',note:''},{room:'108',name:'Siuizca',note:''},{room:'109',name:'Lahl',note:''},{room:'110',name:'Yunusa',note:''},{room:'111',name:'H. Chen',note:''},{room:'112',name:'D. Liu',note:''},{room:'113',name:'Zöller',note:' const q=document.getElementById('q'),results=document.getElementById('results'),count=document.getElementById('count');
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function copyText(text){navigator.clipboard?.writeText(text).catch(()=>{}); alert('Kopiert: '+text)}
function shareText(text){if(navigator.share){navigator.share({text})} else {copyText(text)}}
function render(){const term=q.value.trim().toLowerCase(); const filtered=term?tenants.filter(t=>t.name.toLowerCase().includes(term)||t.room.includes(term)||t.note.toLowerCase().includes(term)):tenants; count.textContent=filtered.length+' Treffer'; results.innerHTML=filtered.map(t=>`<div class="card result"><div class="name">${escapeHtml(t.name)}</div><div class="room"><strong>${escapeHtml(t.room)}</strong></div>${t.note?`<div class="note">${escapeHtml(t.note)}</div>`:''}<div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap"><button onclick="copyText('${escapeHtml(t.name)} = ${escapeHtml(t.room)}')">Kopieren</button><button class="secondary" onclick="shareText('${escapeHtml(t.name)} = ${escapeHtml(t.room)}')">Teilen</button></div></div>`).join('')||'<div class="card">Kein Treffer gefunden.</div>'}
q.addEventListener('input',render); document.getElementById('clear').onclick=()=>{q.value=''; render(); q.focus()}; render();
</script>
</body>
</html>
